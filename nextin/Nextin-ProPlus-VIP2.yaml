# Nextin subscription template adapted from HenryChiao/MIHOMO_YAMLS
# Source: THEYAMLS/General_Config/HenryChiao/MihomoProPlus.yaml
# Source blob: 90fa3a506e8915d69f0c9818597044c62d198f87 (retrieved 2026-10-28)
# Upstream authors: YYDS666 / HenryChiao. Upstream repository license: AGPL-3.0.
# Bind this template to VIP2. Nodes are injected by Nextin; no airport URL is stored here.
# Original DNS, groups, provider URLs and UDP/443 rejection are retained.
# Three known Tonghuashun domain suffixes are explicitly DIRECT at the top.
# Remote rule-providers are retained from upstream and require successful downloads.
# Desktop listeners, dashboard, credentials, TUN and custom hosts are omitted.
# No Nextin device validation has been performed.

